name: Publish Docker Image

# Publishing is driven by Git tags: every pushed `v*` tag is built, pushed and
# signed here. Creating a GitHub release from a new tag pushes that tag as well,
# so the release flow is covered too. Tags that already exist can be
# (re-)published with `workflow_dispatch` on the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required for cosign keyless (OIDC) to mint tokens
permissions:
  contents: read
  packages: write
  id-token: write # needed for signing the images with GitHub OIDC Token

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/openmodelica/crossbuild

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true

      - name: Sign the images with GitHub OIDC Token (tag-based)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "${TAGS:-}" ] || { echo "No tags found"; exit 1; }
          images=""
          while IFS= read -r tag; do
            tag="$(echo "$tag" | xargs)"   # trim whitespace
            [ -z "$tag" ] && continue
            images+="${tag} "
            echo "Signing tag: ${tag}"
            cosign sign --yes "${tag}"
          done < <(echo "${TAGS:-}" | tr ',' '\n')

      - name: Verify signatures (tag-based)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "${TAGS:-}" ] || { echo "No tags found"; exit 1; }
          CERT_ID="https://github.com/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}"
          CERT_ISSUER="https://token.actions.githubusercontent.com"
          while IFS= read -r tag; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            echo "Verifying tag: ${tag}"
            cosign verify \
              --certificate-identity="${CERT_ID}" \
              --certificate-oidc-issuer="${CERT_ISSUER}" \
              "${tag}"
          done < <(echo "${TAGS:-}" | tr ',' '\n')
